name: CI mínimo Aurum Nova

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estructura del sitio
        run: |
          python3 << 'EOF'
          import os
          import sys
          import re
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit

          base_dir = '.'
          site_base_path = '/aurum-nova'
          errors = []

          class AnchorParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.anchors = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.anchors.add(attrs['id'])
                  if tag.lower() == 'a' and attrs.get('name'):
                      self.anchors.add(attrs['name'])

          def check_file_not_empty(filepath, description):
              full_path = os.path.join(base_dir, filepath)
              if not os.path.exists(full_path):
                  errors.append(f'ERROR: {description} no existe ({filepath})')
                  return False

              if os.path.getsize(full_path) == 0:
                  errors.append(f'ERROR: {description} está vacío ({filepath})')
                  return False

              return True

          def check_dir_exists(dirpath, description):
              full_path = os.path.join(base_dir, dirpath)
              if not os.path.isdir(full_path):
                  errors.append(f'ERROR: {description} no existe ({dirpath}/)')
                  return False
              return True

          check_file_not_empty('index.html', 'index.html')
          check_file_not_empty('aurumpitch.html', 'aurumpitch.html')
          check_dir_exists('assets', 'assets/')
          check_dir_exists('blog', 'blog/')

          blog_dir = os.path.join(base_dir, 'blog')
          blog_htmls = []

          if os.path.isdir(blog_dir):
              blog_htmls = sorted(
                  f for f in os.listdir(blog_dir)
                  if f.endswith('.html')
              )

              if not blog_htmls:
                  errors.append('ERROR: blog/ no contiene archivos HTML')

              for name in blog_htmls:
                  check_file_not_empty(
                      os.path.join('blog', name),
                      name
                  )

          html_files = ['index.html', 'aurumpitch.html']
          html_files += [
              os.path.join('blog', name)
              for name in blog_htmls
          ]

          href_pattern = re.compile(r'href="([^"]+)"')
          src_pattern = re.compile(r'src="([^"]+)"')

          all_refs = []
          anchors_by_file = {}

          for rel_path in html_files:
              full_html_path = os.path.join(base_dir, rel_path)

              with open(full_html_path, encoding='utf-8') as f:
                  content = f.read()

              anchor_parser = AnchorParser()
              anchor_parser.feed(content)
              anchors_by_file[os.path.normpath(rel_path)] = anchor_parser.anchors

              all_refs += [
                  (rel_path, ref)
                  for ref in href_pattern.findall(content)
              ]

              all_refs += [
                  (rel_path, ref)
                  for ref in src_pattern.findall(content)
              ]

          external_prefixes = (
              'http://',
              'https://',
              'mailto:',
              'tel:',
              'javascript:',
              '//'
          )

          local_refs = []

          for html_file, ref in all_refs:
              if ref.startswith(external_prefixes):
                  continue

              if '${' in ref:
                  continue

              if 'data:' in ref:
                  continue

              local_refs.append((html_file, ref))

          print(
              f'Encontradas {len(local_refs)} referencias locales a verificar'
          )

          missing_files = []
          missing_anchors = []
          checked_anchors = 0

          for html_file, ref in local_refs:
              parsed_ref = urlsplit(ref)
              ref_path = unquote(parsed_ref.path)
              query = parsed_ref.query  # Query strings do not change the filesystem path.
              fragment = unquote(parsed_ref.fragment)

              if ref_path.startswith('/'):
                  if ref_path == site_base_path or ref_path == site_base_path + '/':
                      relative_path = 'index.html'
                  elif ref_path.startswith(site_base_path + '/'):
                      relative_path = ref_path[len(site_base_path) + 1:]
                  else:
                      missing_files.append((html_file, ref))
                      continue
                  resolved_path = os.path.normpath(
                      os.path.join(base_dir, relative_path)
                  )
              elif ref_path:
                  html_dir = os.path.dirname(
                      os.path.join(base_dir, html_file)
                  )
                  resolved_path = os.path.normpath(
                      os.path.join(html_dir, ref_path)
                  )
              else:
                  resolved_path = os.path.normpath(
                      os.path.join(base_dir, html_file)
                  )

              if not os.path.exists(resolved_path):
                  missing_files.append((html_file, ref))
                  continue

              if fragment:
                  anchor_path = resolved_path
                  if os.path.isdir(anchor_path):
                      anchor_path = os.path.join(anchor_path, 'index.html')

                  if anchor_path.lower().endswith(('.html', '.htm')):
                      if not os.path.isfile(anchor_path):
                          missing_anchors.append(
                              (html_file, ref, fragment, anchor_path)
                          )
                          continue

                      anchor_key = os.path.normpath(anchor_path)
                      if anchor_key not in anchors_by_file:
                          with open(anchor_path, encoding='utf-8') as f:
                              target_content = f.read()
                          target_parser = AnchorParser()
                          target_parser.feed(target_content)
                          anchors_by_file[anchor_key] = target_parser.anchors

                      checked_anchors += 1
                      if fragment not in anchors_by_file[anchor_key]:
                          missing_anchors.append(
                              (html_file, ref, fragment, anchor_path)
                          )

          if missing_files:
              errors.append(
                  f'ERROR: {len(missing_files)} archivos referenciados no existen:'
              )

              for html_file, ref in sorted(set(missing_files)):
                  errors.append(
                      f'  - {html_file} -> {ref}'
                  )

          if missing_anchors:
              errors.append(
                  f'ERROR: {len(missing_anchors)} anchors internos no existen:'
              )

              for html_file, ref, fragment, target in sorted(set(missing_anchors)):
                  errors.append(
                      f'  - {html_file} -> {ref} '
                      f'(#{fragment} no existe en {target})'
                  )

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print('Todos los checks pasaron')
          print('  - index.html: existe y no está vacío')
          print('  - aurumpitch.html: existe y no está vacío')
          print('  - assets/: existe')
          print('  - blog/: existe')
          print(f'  - HTML del blog: {len(blog_htmls)} verificados')
          print(
              f'  - Referencias locales: {len(local_refs)} verificadas, '
              f'0 faltantes'
          )
          print(f'  - Fragments HTML: {checked_anchors} verificados')
          EOF
