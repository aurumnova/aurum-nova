<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada | AURUM NOVA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/aurum-nova/favicon.ico">
<link rel="apple-touch-icon" href="/aurum-nova/favicon.ico">
<style>
  :root {
    --bg: #050509;
    --text: #f4f1ea;
    --muted: #9b968c;
    --gold: #d4af37;
    --border: rgba(212, 175, 55, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background:
      radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .brand {
    display: inline-block;
    margin-bottom: 32px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.14em;
    font-size: 0.95rem;
  }
  .brand span { color: var(--gold); }
  .code {
    margin: 0;
    font-size: clamp(4rem, 18vw, 8rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
  }
  h1 { margin: 12px 0 10px; font-size: clamp(1.3rem, 4vw, 2rem); }
  p { margin: 0 auto 28px; max-width: 460px; color: var(--muted); line-height: 1.6; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .btn.primary { background: var(--gold); color: #0a0a0f; }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.ghost { border: 1px solid var(--border); color: var(--text); }
  .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
  <main>
    <a class="brand" href="/aurum-nova/">AURUM <span>NOVA</span></a>
    <p class="code">404</p>
    <h1>Esta página no existe.</h1>
    <p>El enlace puede haber cambiado o ya no estar disponible. Vuelve al inicio o escríbenos directamente.</p>
    <div class="actions">
      <a class="btn primary" href="/aurum-nova/">Volver al inicio</a>
      <a class="btn ghost" href="/aurum-nova/#contact">Contacto</a>
    </div>
  </main>
</body>
</html>
